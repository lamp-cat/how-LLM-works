# Shared-host locations for https://api.garryai.icu/how-LLM-works/
#
# Paste these inside the existing server { } that already serves New API at /
# and /api/*, and the other site at /how-image-models-work/. Do not replace
# those locations. Nginx chooses the longest matching prefix, so
# /how-LLM-works/ is not captured by / or /api/.
#
# PREFIX: retain it. proxy_pass has no URI path, so Node sees
# /how-LLM-works/... exactly. A trailing slash on proxy_pass would strip the
# prefix and the browser would then request /assets and /api on the New API.
#
# Case-sensitive. Do not use ~* or a lowercase alias. The other site's prefix
# /how-image-models-work/ must stay on its own upstream.
#
# Replace HOST_PORT with the host port the coordinator publishes only on
# 127.0.0.1. Do not add add_header in this location: Nginx would then drop the
# upstream COOP/COEP/CORP headers that WebGPU needs.

location = /how-LLM-works {
    return 308 /how-LLM-works/$is_args$args;
}

location /how-LLM-works/ {
    proxy_pass http://127.0.0.1:HOST_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 16k;
}
